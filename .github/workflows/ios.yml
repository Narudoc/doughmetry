name: iOS

# ios/ 변경마다: LevainCore 테스트(swift test) · 앱 빌드(시뮬레이터) · 영어 사전 누락 검사,
# 그리고 옛 iOS 런타임(17.5 · 18.2) 시뮬레이터에서 LevainCore 테스트(oldest-ios).
# UI 스모크 테스트(LevainCalcUITests)는 오래 걸려 수동 실행(workflow_dispatch)에서만 돈다 — 가장 새 런타임과 옛 런타임 모두.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      ui_tests:
        description: 'UI 스모크 테스트(LevainCalcUITests)도 돌린다'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # 이미지에 든 가장 새 정식 Xcode — Xcode 27이 이미지에 들어오면 저절로 그것을 쓴다
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: LevainCore tests
        working-directory: ios/LevainCore
        run: swift test

      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild -project ios/LevainCalc.xcodeproj -scheme LevainCalc \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/app-build.log"

      # 빌드가 실패하면 컴파일 오류를 주석으로 남긴다 — 작업 로그는 로그인해야 보이지만 주석은 누구나 본다
      - name: Compiler errors
        if: failure()
        run: |
          grep -E '^/.+:[0-9]+:[0-9]+: error: ' "$RUNNER_TEMP/app-build.log" | sort -u | head -50 | while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=${rest%%:*}::${line#*: error: }"
          done || true
          grep -E 'error:' "$RUNNER_TEMP/app-build.log" | grep -vE '^/.+:[0-9]+:[0-9]+: error: ' | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done || true

      # 아직 막지 않는다 — 러너의 Swift가 로컬(Xcode 27)과 달라 로컬에서 재현할 수 없는 경고로 빨개질 수 있다.
      # 러너에 Xcode 27이 들어오면 실패로 바꾼다
      - name: Compiler warnings (non-blocking)
        run: |
          grep -E '^/.+:[0-9]+:[0-9]+: warning: ' "$RUNNER_TEMP/app-build.log" | sort -u | while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            echo "::warning file=${file#"$GITHUB_WORKSPACE"/},line=${rest%%:*}::${line#*: warning: }"
          done || true

      # L("…")/LF("…")의 한국어 키마다 Localization.swift의 영어 사전(en)에 항목이 있는지 (로컬에서도 같은 명령)
      - name: Localization check
        run: python3 ios/scripts/check_l10n.py

  # build-and-test와 나란히 — 영어 사전 누락으로 그 작업이 실패해도 스모크 테스트는 돈다
  ui-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.ui_tests
    runs-on: macos-26
    timeout-minutes: 30
    # 시뮬레이터 안의 테스트는 러너 환경 변수를 받지 않는다 — xcodebuild가 TEST_RUNNER_ 접두를 떼어 넘긴다
    # (CI에선 시간 제한 테스트가 폭주만 잡는다: LibrarySyncTests.mergePerformance)
    env:
      TEST_RUNNER_CI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # 가장 새 iOS 런타임의 첫 iPhone
      - name: UI smoke tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(n) for n in re.findall(r"\d+", key.rsplit("iOS", 1)[-1])]
          for key in sorted((k for k in runtimes if ".iOS-" in k), key=version, reverse=True):
              phones = [d["udid"] for d in runtimes[key] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0])
                  break
          ')
          test -n "$UDID"
          xcrun simctl list devices | grep "$UDID"
          xcodebuild test -project ios/LevainCalc.xcodeproj -scheme LevainCalc \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/LevainCalcUITests.xcresult" \
            -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO -only-testing:LevainCalcUITests

      # 탭별 스크린샷(한국어·영어)이 결과 번들에 첨부돼 있다
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LevainCalcUITests.xcresult
          path: ${{ runner.temp }}/LevainCalcUITests.xcresult
          if-no-files-found: ignore

  # 최소 지원 iOS(17.0) 쪽 런타임에서 LevainCore 테스트 — 정규식 단어 경계·ISO 8601 파싱처럼 Foundation 동작이
  # OS 버전마다 달라(17.5에서만, 18.2에서만 틀린 적이 있다) 호스트의 swift test로는 잡히지 않는다.
  # 러너 이미지에는 iOS 26 런타임뿐이라 내려받는다(수 분). 받지 못하면 경고를 남기고 설치된 가장 오래된 런타임으로 돈다
  oldest-ios:
    name: oldest-ios (iOS ${{ matrix.ios }})
    runs-on: macos-26
    timeout-minutes: 60
    # 시뮬레이터 안의 테스트는 러너 환경 변수를 받지 않는다 — xcodebuild가 TEST_RUNNER_ 접두를 떼어 넘긴다
    # (CI에선 시간 제한 테스트가 폭주만 잡는다: LibrarySyncTests.mergePerformance)
    env:
      TEST_RUNNER_CI: "true"
    strategy:
      fail-fast: false
      matrix:
        ios: ['17.5', '18.2']
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app | grep -vi -e beta -e release_candidate | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: iOS ${{ matrix.ios }} runtime
        run: |
          if ! xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["runtimes"]
          sys.exit(0 if any(r["platform"] == "iOS" and r["version"] == sys.argv[1] and r["isAvailable"] for r in runtimes) else 1)
          ' "${{ matrix.ios }}"; then
            xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.ios }}" ||
              echo "::warning::iOS ${{ matrix.ios }} 런타임을 내려받지 못했다 — 설치된 가장 오래된 iOS 런타임으로 테스트한다"
          fi
          xcrun simctl list runtimes

      # 그 런타임(없으면 가장 오래된 런타임)의 iPhone — 내려받은 런타임에는 기기가 없을 수 있어 만든다
      - name: Simulator
        id: sim
        run: |
          read -r UDID VERSION <<< "$(xcrun simctl list -j | python3 -c '
          import json, re, subprocess, sys
          want = sys.argv[1]
          listing = json.load(sys.stdin)
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime["version"])]
          runtimes = [r for r in listing["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          exact = [r for r in runtimes if r["version"] == want]
          runtime = exact[0] if exact else min(runtimes, key=version)
          phones = [d["udid"] for d in listing["devices"].get(runtime["identifier"], [])
                    if d["isAvailable"] and d["name"].startswith("iPhone")]
          if phones:
              udid = phones[0]
          else:
              types = [t for t in runtime["supportedDeviceTypes"] if t["productFamily"] == "iPhone"]
              kind = next((t for t in types if t["name"] == "iPhone 15"), types[-1])
              udid = subprocess.check_output(
                  ["xcrun", "simctl", "create", "CI " + kind["name"], kind["identifier"], runtime["identifier"]],
                  text=True).strip()
          print(udid, runtime["version"])
          ' "${{ matrix.ios }}")"
          test -n "$UDID"
          xcrun simctl list devices | grep "$UDID"
          if [ "$VERSION" != "${{ matrix.ios }}" ]; then
            echo "::warning::iOS ${{ matrix.ios }} 대신 iOS $VERSION 런타임으로 테스트한다"
          fi
          echo "LevainCore 테스트 런타임: iOS $VERSION (요청 ${{ matrix.ios }})" >> "$GITHUB_STEP_SUMMARY"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 패키지 자동 스킴 LevainCore-Package만 테스트 동작이 있다 (라이브러리 스킴 LevainCore에는 없다)
      - name: LevainCore tests (iOS ${{ steps.sim.outputs.version }})
        working-directory: ios/LevainCore
        run: |
          xcodebuild test -scheme LevainCore-Package -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd-core" -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO

      - name: UI smoke tests (iOS ${{ steps.sim.outputs.version }})
        if: ${{ !cancelled() && steps.sim.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.ui_tests }}
        run: |
          xcodebuild test -project ios/LevainCalc.xcodeproj -scheme LevainCalc \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/LevainCalcUITests-ios${{ matrix.ios }}.xcresult" \
            -collect-test-diagnostics never CODE_SIGNING_ALLOWED=NO -only-testing:LevainCalcUITests

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.ui_tests }}
        with:
          name: LevainCalcUITests-ios${{ matrix.ios }}.xcresult
          path: ${{ runner.temp }}/LevainCalcUITests-ios${{ matrix.ios }}.xcresult
          if-no-files-found: ignore
